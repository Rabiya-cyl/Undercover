<title>Undercover</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c14;--card:#11141f;--tx:#e8eaf4;--mu:#8189a8;--ac:#7c6cff;--ac2:#ff4f8b;--bd:#242a3f;--ok:#3ddc97;--bad:#ff5c7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:8px 0 2px;letter-spacing:-.5px}h2{font-size:19px;margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:6px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pick button{flex:0 0 auto;width:44px;height:44px;padding:0;font-size:24px;background:var(--bg);border:2px solid transparent}
.pick button.on{border-color:var(--ac)}.pick .c{width:34px;height:34px;border-radius:50%}.pick .c.on{border-color:var(--tx)}
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.pl:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.pl.dead{opacity:.45;text-decoration:line-through}.pl.turn{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:10px;padding-left:6px}
.pl b{flex:1}.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--bd)}
.word{text-align:center;font-size:34px;font-weight:800;padding:18px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;margin:8px 0}
.clue{padding:6px 0;border-bottom:1px dashed var(--bd)}.code{font-size:28px;letter-spacing:5px;font-weight:800;color:var(--ac)}
.vote{display:flex;width:100%;align-items:center;gap:10px;margin:6px 0;background:var(--bg);color:var(--tx);border:2px solid var(--bd);text-align:left}.vote.on{border-color:var(--ac2)}
.big{font-size:20px;text-align:center;font-weight:700;margin:6px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
body{font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;background:#0a0c14}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 30%,transparent 40%,rgba(0,0,0,.5))}
#app{position:relative;z-index:1;padding-bottom:40px}
h1{font-weight:700;text-transform:uppercase;letter-spacing:3px;font-size:26px;background:linear-gradient(90deg,#b9adff,#ff7eb0);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:15px;color:#c9ccea}
.card{background:rgba(14,16,27,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(124,108,255,.25);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
button{font-family:inherit;letter-spacing:.8px;text-transform:uppercase;font-size:14px;background:linear-gradient(135deg,#6a5bff,#c04bff);box-shadow:0 0 18px rgba(124,108,255,.35);border-radius:8px;transition:transform .12s}
button:active{transform:scale(.97)}
button.sec{background:rgba(255,255,255,.03);box-shadow:none;border:1px solid #343b58;color:#d6d9f2}
input[type=text]{background:#0b0d17;border:1px solid #2a3050;border-radius:8px;font-family:inherit}
input[type=text]:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,108,255,.25)}
.av{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 25%,#2e3358,#10121e);border:2px solid var(--c,#7c6cff);overflow:hidden;box-shadow:0 0 14px color-mix(in srgb,var(--c,#7c6cff) 50%,transparent);display:block}
.av svg,.pick button svg{display:block;width:100%;height:100%}
.big-av{width:92px;height:92px;margin:0 auto 12px}.big-av .av{width:100%;height:100%}
.pick button{width:54px;height:54px;border-radius:50%;padding:0;background:#10121e;border:2px solid #2a3050;box-shadow:none;overflow:hidden}
.pick button.on{border-color:var(--ac);box-shadow:0 0 14px rgba(124,108,255,.6)}
.pick .c{width:32px;height:32px}
.pick button:disabled{border-radius:8px;padding:4px;opacity:.45}
.pick button.gc{border-radius:8px;background:repeating-linear-gradient(45deg,#17143a 0 6px,#1f1a4d 6px 12px);border:1px solid #7c6cff;color:#9d90ff;font-size:28px;font-weight:700;box-shadow:inset 0 0 16px rgba(124,108,255,.35),0 0 12px rgba(124,108,255,.2)}
.word{background:linear-gradient(160deg,#1a1545,#33174a);border:1px solid #7c6cff;box-shadow:0 0 36px rgba(124,108,255,.4),inset 0 0 30px rgba(255,79,139,.12);text-transform:uppercase;letter-spacing:3px;border-radius:12px;color:#fff}
.vote{background:#0d1020;border:1px solid #2a3050;color:var(--tx);box-shadow:none;text-transform:none;font-size:16px}.vote.on{border-color:#ff4f8b;box-shadow:0 0 14px rgba(255,79,139,.4)}
.tag{background:#0d1020;border-color:#2a3050;color:#b9bde0}
.code{text-shadow:0 0 14px rgba(124,108,255,.8)}
#bg .st{animation:tw 3s infinite alternate}#bg .mist{animation:dr 28s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}@keyframes dr{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@media (prefers-reduced-motion:reduce){#bg .st,#bg .mist{animation:none}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gi{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;background:#0d1020;border:2px solid #2a3050;box-shadow:none;text-transform:none;font-size:12px;letter-spacing:0;color:var(--tx)}
.gi img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--ac)}
.gi.on{border-color:#ff4f8b;box-shadow:0 0 14px rgba(255,79,139,.5)}.gi:disabled{opacity:.4}.gi em{font-style:normal;font-size:11px;color:var(--mu)}

async function init(){
  try{db=await claude.use("db")}catch(e){}
  const c=(location.hash||"").slice(1).toUpperCase();if(db&&/^[A-Z0-9]{4}$/.test(c)){draft.code=c;mode="online"}
  render();
}
function listen(){
  unsubs.forEach(u=>u());unsubs=[];
  unsubs.push(rdoc().onSnapshot(s=>{room=s.exists?s.data():null;render();host()},e=>{err="Connexion perdue"}));
  unsubs.push(pcol().onSnapshot(s=>{pls=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.joined||0)-(b.joined||0));render();host()},e=>{err="Connexion perdue"}));
}
async function pickAv(id){if(pls.some(p=>p.av===id&&p.id!==me))return;try{await pcol().doc(me).update({av:id})}catch(e){err="Erreur : "+(e.message||e.code);render()}}
async function enter(create){
  const name=draft.name.trim();if(!name){err="Choisis un prénom !";return render()}
  code=create?Math.random().toString(36).slice(2,6).toUpperCase():draft.code.trim().toUpperCase();
  if(code.length!==4){err="Le code a 4 caractères";return render()}
  try{localStorage.setItem("uc_profile",JSON.stringify({emoji:draft.emoji,color:draft.color,acc:draft.acc,img:draft.img,name}))}catch(e){}
  try{
    const r=await rdoc().get();
    if(create){await rdoc().set({host:me,phase:"lobby",created:Date.now()})}
    else if(!r.exists){err="Salle introuvable";code="";return render()}
    else if(r.data().phase!=="lobby"&&!(await pcol().doc(me).get()).exists){err="La partie a déjà commencé";code="";return render()}
    const old=await pcol().doc(me).get();
    const all=await pcol().get(),taken=new Set(all.docs.filter(d=>d.id!==me).map(d=>d.data().av));
    let a_=old.exists?old.data().av:null;
    if(!a_||taken.has(a_)){const f=shuf(GAL.filter(g=>!taken.has(g.id)));if(!f.length){err="Salle pleine (12 joueurs maximum)";code="";return render()}a_=f[0].id}
    await pcol().doc(me).set({...(old.exists?old.data():{alive:true,joined:Date.now()}),name,av:a_});
    location.hash=code;err="";listen();
  }catch(e){err="Erreur : "+(e.message||e.code);render()}
}
const W=(r,p)=>Promise.all([rdoc().update(r),...Object.entries(p||{}).map(([id,d])=>pcol().doc(id).update(d))]);
async function start(){
  const ps=shuf(pls),n=ps.length,pair=shuf(PAIRS)[0],sw=Math.random()<.5,cw=sw?pair[0]:pair[1],uw=sw?pair[1]:pair[0];
  const roles={};ps.forEach((p,i)=>roles[p.id]=i===0?"undercover":(i===1&&n>=5)?"white":"civil");
  const upd={};ps.forEach(p=>{const r=roles[p.id];upd[p.id]={role:r,word:r==="civil"?cw:r==="undercover"?uw:"",alive:true,vote:null}});
  await W({phase:"clues",round:1,order:shuf(ps.map(p=>p.id)),turn:0,clues:[],civilWord:cw,underWord:uw,elim:null,tie:false,winner:null,msg:""},upd);
}
async function sendClue(){
  const t=($("#clue")?.value||"").trim();if(!t)return;const i=room.turn+1;
  await rdoc().update({clues:[...(room.clues||[]),{id:me,text:t,round:room.round}],turn:i,phase:i>=room.order.length?"vote":"clues"});
}
const vote=id=>pcol().doc(me).update({vote:id});
function host(){ // le chef de salle fait avancer la partie
  if(!isHost()||busy||!room||room.phase!=="vote")return;
  const a=alive();if(!a.length||a.some(p=>!p.vote||!P(p.vote)))return;
  busy=true;const c={};a.forEach(p=>c[p.vote]=(c[p.vote]||0)+1);
  const mx=Math.max(...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===mx),e=shuf(top)[0];
  W({phase:"result",elim:e,tie:top.length>1},{[e]:{alive:false}}).finally(()=>busy=false);
}
async function next(){ // après un résultat
  const e=P(room.elim);if(e&&e.role==="white"&&!room.guessed){await rdoc().update({phase:"guess",guessed:true});return}
  await check();
}
async function check(msg){
  const a=alive(),u=a.filter(p=>p.role==="undercover").length,w=a.filter(p=>p.role==="white").length,c=a.length-u-w;
  if(u+w===0)return rdoc().update({phase:"end",winner:"civils",msg:msg||""});
  if(c<=u+w)return rdoc().update({phase:"end",winner:"infiltres",msg:msg||""});
  const upd={};a.forEach(p=>upd[p.id]={vote:null});
  await W({phase:"clues",round:(room.round||1)+1,order:shuf(a.map(p=>p.id)),turn:0,clues:[],elim:null,tie:false,guessed:false,msg:msg||""},upd);
}
async function guess(){
  const g=($("#guess")?.value||"").trim();if(!g)return;
  if(norm(g)===norm(room.civilWord))await rdoc().update({phase:"end",winner:"white",msg:"Mr White a trouvé « "+g+" » !"});
  else await check("Mr White s’est trompé (« "+g+" »).");
}
async function again(){
  const upd={};pls.forEach(p=>upd[p.id]={role:null,word:"",alive:true,vote:null});
  await W({phase:"lobby",clues:[],winner:null,elim:null,guessed:false,msg:""},upd);
}
async function leave(){
  const inGame=room&&room.phase!=="lobby";
  unsubs.forEach(u=>u());unsubs=[];
  try{if(!inGame){await pcol().doc(me).delete();const rest=pls.filter(p=>p.id!==me);if(isHost()&&rest.length)await rdoc().update({host:rest[0].id})}}catch(e){}
  code="";room=null;pls=[];err="";draft.code="";history.replaceState(null,"",location.pathname);location.hash="";render();
}

function lround(){L.order=shuf(L.players.map((p,i)=>i).filter(i=>L.players[i].alive));L.step="play"}
function lstart(){
  const idx=L.names.map((s,i)=>s.trim()?i:-1).filter(i=>i>=0),names=idx.map(i=>L.names[i].trim());if(names.length<3){L.err="Il faut au moins 3 joueurs";return render()}
  const n=names.length,pair=shuf(PAIRS)[0],sw=Math.random()<.5,cw=sw?pair[0]:pair[1],uw=sw?pair[1]:pair[0];
  const roles=shuf(names.map((_,i)=>i===0?"undercover":(i===1&&n>=5)?"white":"civil"));
  L={...L,step:"pick",err:"",pickFor:null,players:names.map((name,i)=>({name,av:(L.avs&&L.avs[idx[i]])||GAL[i%GAL.length].id,color:COL[i%COL.length],alive:true})),cards:roles.map(r=>({role:r,word:r==="civil"?cw:r==="undercover"?uw:"",by:null})),who:0,shown:null,cw,uw,round:1,sel:null,elim:null,guessed:false,msg:""};render();
}
function lcheck(msg){
  const a=L.players.filter(p=>p.alive),u=a.filter(p=>p.role==="undercover").length,w=a.filter(p=>p.role==="white").length,c=a.length-u-w;
  L.msg=msg||"";
  if(u+w===0){L.step="end";L.winner="civils"}else if(c<=u+w){L.step="end";L.winner="infiltres"}else{L.round++;L.guessed=false;lround()}
  render();
}
function lguess(){
  const g=($("#lguess")?.value||"").trim();if(!g)return;
  if(norm(g)===norm(L.cw)){L.step="end";L.winner="white";L.msg="Mr White a trouvé « "+g+" » !";render()}else lcheck("Mr White s’est trompé (« "+g+" »).");
}
function lact(a,b){const i=+b.dataset.i;
  if(a==="M_online"){if(!db)return;mode="online";return render()}
  if(a==="M_back"){mode=null;return render()}
  if(a==="L_start"){L={step:"setup",names:["","",""],avs:GAL.slice(0,3).map(g=>g.id),pickFor:null,err:""};return render()}
  if(a==="L_menu"){L.ask=true;return render()}
  if(a==="L_no"){L.ask=false;return render()}
  if(a==="L_yes"){L=null;mode=null;return render()}
  if(a==="L_add"){if(L.names.length<12){L.names.push("");L.avs.push((GAL.find(g=>!L.avs.includes(g.id))||GAL[0]).id)}return render()}
  if(a==="L_av"){L.pickFor=L.pickFor===i?null:i;return render()}
  if(a==="L_setav"){if(L.pickFor!=null&&!L.avs.some((v,j)=>v===b.dataset.id&&j!==L.pickFor))L.avs[L.pickFor]=b.dataset.id;L.pickFor=null;return render()}
  if(a==="L_go")return lstart();
  if(a==="L_pick"){L.shown=i;return render()}
  if(a==="L_hide"){const p=L.players[L.who],c=L.cards[L.shown];p.role=c.role;p.word=c.word;c.by=L.who;L.shown=null;L.who++;if(L.who>=L.players.length)lround();return render()}
  if(a==="L_vote0"){L.step="vote";L.sel=null;return render()}
  if(a==="L_sel"){L.sel=i;return render()}
  if(a==="L_elim"){if(L.sel==null)return;L.players[L.sel].alive=false;L.elim=L.sel;L.step="result";return render()}
  if(a==="L_next"){if(L.players[L.elim].role==="white"&&!L.guessed){L.guessed=true;L.step="guess";return render()}return lcheck()}
  if(a==="L_guess")return lguess();
  if(a==="L_again"){L={step:"setup",names:L.players.map(p=>p.name),avs:L.players.map(p=>p.av),pickFor:null,err:""};return render()}
}
function lview(){
  const s=L.step,pl=L.players||[],h=`<div class="row" style="align-items:center"><h1 style="flex:3"> Undercover</h1><button class="sec" data-act="L_menu" style="flex:0 0 auto;padding:4px 10px;font-size:13px">← Menu</button></div>${L.ask?`<div class="card"><b>Quitter la partie ?</b><div class="row" style="margin-top:8px"><button class="sec" data-act="L_no">Non</button><button data-act="L_yes">Oui, quitter</button></div></div>`:""}`;
  if(s==="setup")return h+`<div class="card"><h2>📱 Qui joue ? (3 à 12)</h2>${L.names.map((n,i)=>{const g=GAL.find(x=>x.id===L.avs[i])||GAL[0];return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><button class="gi ${L.pickFor===i?"on":""}" data-act="L_av" data-i="${i}" title="Choisir le personnage" style="width:auto;flex:0 0 auto;padding:3px"><img src="${g.s}" alt="${esc(g.n)}" style="width:44px;height:44px"></button><input type="text" id="ln${i}" placeholder="Joueur ${i+1}" maxlength="14" value="${esc(n)}" style="flex:1;margin:0"></div>`}).join("")}${L.pickFor!=null?`<p class="mu" style="margin:8px 0 4px">Personnage de Joueur ${L.pickFor+1} :</p><div class="gal">${GAL.map(g=>{const used=L.avs.some((v,j)=>v===g.id&&j!==L.pickFor);return `<button class="gi ${L.avs[L.pickFor]===g.id?"on":""}" data-act="L_setav" data-id="${g.id}" ${used?"disabled":""}><img src="${g.s}" alt=""><span>${esc(g.n)}</span>${used?"<em>pris</em>":""}</button>`}).join("")}</div>`:""}
  ${L.err?`<p class="bad">${esc(L.err)}</p>`:""}<div class="row"><button class="sec" data-act="L_add">+ Ajouter</button><button data-act="L_go">Distribuer les cartes</button></div>
  <p class="mu">À partir de 5 joueurs, il y a aussi un Mr White.</p></div>`;
  if(s==="pick"){const p=pl[L.who];
    if(L.shown!==null){const c=L.cards[L.shown];return h+`<div class="card"><div class="mu">Carte de ${esc(p.name)} : ne la montre à personne !</div>${c.role==="white"?'<div class="word" style="font-size:22px">Tu n’as pas de mot 👻<br><small>Improvise !</small></div>':`<div class="word">${esc(c.word)}</div>`}<button data-act="L_hide" style="width:100%">J’ai vu, cacher la carte</button></div>`}
    return h+`<div class="card"><div class="pl" style="border:0">${av(p)}<h2 style="margin:0">${esc(p.name)}, choisis une carte</h2></div><p class="mu">Les autres ne regardent pas l’écran. Carte ${L.who+1}/${pl.length}.</p><div class="pick">${L.cards.map((c,i)=>c.by!==null?`<button disabled style="width:64px;height:88px;font-size:26px">${face(pl[c.by])}</button>`:`<button data-act="L_pick" data-i="${i}" class="gc" style="width:64px;height:88px">?</button>`).join("")}</div></div>`}
  if(s==="play")return h+`<div class="card"><h2>Manche ${L.round}</h2><p>Chacun donne un indice à voix haute, dans cet ordre :</p>${L.order.map((i,k)=>`<div class="pl">${av(pl[i])}<b>${k+1}. ${esc(pl[i].name)}</b></div>`).join("")}<button data-act="L_vote0" style="width:100%;margin-top:10px">Passer au vote 🗳️</button></div>`;
  if(s==="vote")return h+`<div class="card"><h2>🗳️ Qui est éliminé ?</h2><p class="mu">Discutez, votez à main levée, puis touchez la personne choisie.</p>${pl.map((p,i)=>p.alive?`<button class="vote ${L.sel===i?"on":""}" data-act="L_sel" data-i="${i}">${av(p)}<b>${esc(p.name)}</b></button>`:"").join("")}<button data-act="L_elim" style="width:100%;margin-top:8px" ${L.sel==null?"disabled":""}>Éliminer</button></div>`;
  if(s==="result"){const e=pl[L.elim];return h+`<div class="card"><div class="big">${esc(e.name)} est éliminé(e)</div><div class="big">${roleName[e.role]}</div><button data-act="L_next" style="width:100%">Continuer</button></div>`}
  if(s==="guess")return h+`<div class="card"><div class="big"> ${esc(pl[L.elim].name)} était Mr White !</div><p>Dernière chance : devine le mot des Civils.</p><input type="text" id="lguess" placeholder="Le mot des civils…"><button data-act="L_guess" style="width:100%">Valider</button></div>`;
  const t={civils:"👥 Les Civils gagnent !",infiltres:" Les infiltrés gagnent !",white:"Mr White gagne !"}[L.winner];
  return h+`<div class="card"><div class="big ok">${t}</div>${L.msg?`<p class="mu" style="text-align:center">${esc(L.msg)}</p>`:""}<p style="text-align:center">Mot des civils : <b>${esc(L.cw)}</b><br>Mot de l’undercover : <b>${esc(L.uw)}</b></p>${pl.map(p=>`<div class="pl ${p.alive?"":"dead"}">${av(p)}<b>${esc(p.name)}</b><span class="tag">${roleName[p.role]}</span></div>`).join("")}<button data-act="L_again" style="width:100%;margin-top:10px">Rejouer 🔁</button></div>`;
}
const roleName={civil:"👥 Civil",undercover:" Undercover",white:" Mr White"};
function roster(show){return pls.map(p=>{const cur=room.phase==="clues"&&room.order[room.turn]===p.id;
  return `<div class="pl ${p.alive===false?"dead":""} ${cur?"turn":""}">${av(p)}<b>${esc(p.name)}${p.id===me?" (toi)":""}${room.host===p.id?" ":""}</b>${show&&p.role?`<span class="tag">${roleName[p.role]}</span>`:""}${cur?'<span class="tag">à toi de parler</span>':""}</div>`}).join("")}
function cluesHtml(){const cl=room.clues||[];return cl.length?`<div class="card"><h2>💬 Indices (manche ${room.round})</h2>${cl.map(c=>{const p=P(c.id);return p?`<div class="clue"><b>${esc(p.name)}</b> : ${esc(c.text)}</div>`:""}).join("")}</div>`:""}
function view(){
  if(L)return lview();
  if(!code||!room){
    if(mode!=="online")return chooser();
    return `<button class="sec" data-act="M_back" style="padding:4px 10px;font-size:13px">← Retour</button><h1> Undercover</h1><p class="mu">Crée ton personnage, puis crée une salle ou rejoins celle d’un cousin.</p>
    <div class="card"><h2>Ton nom</h2><input type="text" id="name" placeholder="Ton prénom" maxlength="14" value="${esc(draft.name)}"><p class="mu">Tu choisiras ton personnage dans la salle d’attente.</p>${err?`<p class="bad">${esc(err)}</p>`:""}<button data-act="create" style="width:100%">Créer une salle</button></div>
    <div class="card"><h2>Rejoindre une salle</h2><input type="text" id="code" placeholder="Code (4 caractères)" maxlength="4" value="${esc(draft.code)}" style="text-transform:uppercase"><button class="sec" data-act="join" style="width:100%">Rejoindre</button></div>`}
  const m=mine(),ph=room.phase,head=`<div class="row" style="align-items:center"><h1 style="flex:3"> Undercover</h1><div style="text-align:right">Salle <span class="code" style="font-size:20px;letter-spacing:3px">${code}</span><br><button class="sec" data-act="leave" style="padding:4px 10px;font-size:13px;margin-top:4px">← Quitter</button></div></div>`;
  if(!m&&ph!=="lobby")return head+'<div class="card">Tu n’es pas dans cette partie.</div>';
  if(ph==="lobby"){const n=pls.length;return head+`<div class="card"><h2>Salle d’attente (${n})</h2>${roster()}</div>
    <div class="card"><h2>Choisis ton personnage</h2><p class="mu">Un personnage ne peut être pris que par un seul joueur.</p><div class="gal">${GAL.map(g=>{const o=pls.find(p=>p.av===g.id),mi=o&&o.id===me;return `<button class="gi ${mi?"on":""}" data-act="pickav" data-id="${g.id}" ${o&&!mi?"disabled":""}><img src="${g.s}" alt=""><span>${g.n}</span>${o&&!mi?`<em>${esc(o.name)}</em>`:""}</button>`}).join("")}</div></div>
    <div class="card"><p class="mu">Envoie ce lien à tes cousins pour qu’ils rejoignent : le code est <b class="code" style="font-size:18px">${code}</b></p>
    <p class="mu">${n>=5?"Rôles : 1 Undercover, 1 Mr White et le reste en Civils.":"Rôles : 1 Undercover, le reste en Civils (Mr White arrive à partir de 5 joueurs)."}</p>
    ${isHost()?`<button data-act="start" style="width:100%" ${n<3?"disabled":""}>${n<3?"Il faut au moins 3 joueurs":"Lancer la partie 🚀"}</button>`:'<p class="mu">En attente du lancement par le chef de salle 👑…</p>'}</div>`}
  const mw=m.role==="white"?'<div class="word" style="font-size:22px">Tu n’as pas de mot <br><small>Improvise !</small></div>':`<div class="word">${esc(m.word)}</div>`;
  const me_=`<div class="card"><div class="mu">Ton rôle secret${m.alive===false?" (éliminé)":""}</div>${mw}</div>`;
  if(ph==="clues"){const cur=P(room.order[room.turn]),mine_=cur&&cur.id===me&&m.alive!==false;
    return head+me_+`<div class="card"><h2>Manche ${room.round} — donne un indice</h2>${roster()}
    ${mine_?'<input type="text" id="clue" placeholder="Ton indice (sans dire ton mot !)" maxlength="40"><button data-act="clue" style="width:100%">Envoyer</button>':`<p class="mu">C’est au tour de <b>${esc(cur?.name)}</b>…</p>`}</div>`+cluesHtml()}
  if(ph==="vote"){const a=alive(),mv=m.vote,done=a.filter(p=>p.vote).length;
    return head+me_+cluesHtml()+`<div class="card"><h2>🗳️ Vote : qui est l’intrus ?</h2>${m.alive===false?'<p class="mu">Tu es éliminé, tu regardes.</p>':a.filter(p=>p.id!==me).map(p=>`<button class="vote ${mv===p.id?"on":""}" data-act="vote" data-id="${p.id}">${av(p)}<b>${esc(p.name)}</b></button>`).join("")}
    <p class="mu">${done}/${a.length} ont voté${mv?" — tu peux changer ton vote":""}</p></div>`}
  if(ph==="result"){const e=P(room.elim);return head+`<div class="card"><div class="big">${room.tie?"Égalité : tirage au sort ! 🎲<br>":""}${e?esc(e.name):""} est éliminé(e)</div><div class="big">${e?roleName[e.role]:""}</div>${roster()}
    ${isHost()?'<button data-act="next" style="width:100%">Continuer</button>':'<p class="mu">Le chef de salle  continue la partie…</p>'}</div>`}
  if(ph==="guess"){const e=P(room.elim);return head+`<div class="card"><div class="big"> ${esc(e?.name)} était Mr White !</div>
    ${e?.id===me?'<p>Dernière chance : devine le mot des Civils pour gagner.</p><input type="text" id="guess" placeholder="Le mot des civils…"><button data-act="guess" style="width:100%">Valider</button>':'<p class="mu">Il tente de deviner le mot des civils…</p>'}</div>`}
  if(ph==="end"){const t={civils:"👥 Les Civils gagnent !",infiltres:" Les infiltrés gagnent !",white:" Mr White gagne !"}[room.winner];
    return head+`<div class="card"><div class="big ok">${t}</div>${room.msg?`<p class="mu" style="text-align:center">${esc(room.msg)}</p>`:""}
    <p style="text-align:center">Mot des civils : <b>${esc(room.civilWord)}</b><br>Mot de l’undercover : <b>${esc(room.underWord)}</b></p>${roster(true)}
    ${isHost()?'<button data-act="again" style="width:100%">Rejouer 🔁</button>':'<p class="mu">Le chef de salle  peut relancer une partie.</p>'}</div>`}
  return head
}
function render(){
  const a=document.activeElement,id=a&&a.id,vals={};document.querySelectorAll("#app input").forEach(i=>vals[i.id]=i.value);
  const ss=a&&a.selectionStart;$("#app").innerHTML=view()+(err&&code?`<p class="bad">${esc(err)}</p>`:"");
  Object.entries(vals).forEach(([k,v])=>{const i=document.getElementById(k);if(i)i.value=v});
  if(id){const i=document.getElementById(id);if(i){i.focus();try{i.setSelectionRange(ss,ss)}catch(e){}}}
}
document.addEventListener("input",e=>{if(L&&/^ln\d+$/.test(e.target.id))L.names[+e.target.id.slice(2)]=e.target.value;if(e.target.id==="name")draft.name=e.target.value;if(e.target.id==="code")draft.code=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){if(e.target.id==="clue")sendClue();if(e.target.id==="guess")guess();if(e.target.id==="lguess")lguess()}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(a.startsWith("L_")||a.startsWith("M_")){lact(a,b);return}
  try{
  if(a==="emo"){draft.emoji=+b.dataset.i;render()}else if(a==="col"){draft.color=+b.dataset.i;render()}else if(a==="acc"){draft.acc=+b.dataset.i;render()}
  else if(a==="pickav")await pickAv(b.dataset.id)
  else if(a==="leave")await leave();else if(a==="create")enter(true);else if(a==="join")enter(false);else if(a==="start")await start();
  else if(a==="clue")await sendClue();else if(a==="vote")await vote(b.dataset.id);else if(a==="next")await next();
  else if(a==="guess")await guess();else if(a==="again")await again();
  }catch(x){err="Erreur : "+(x.message||x.code);render()}});
document.addEventListener("change",e=>{const f=e.target.id==="file"&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);draft.img=c.toDataURL("image/jpeg",.82);render()};im.onerror=()=>{err="Image illisible";render()};im.src=r.result};r.readAsDataURL(f)});
init();
</script></body></html>
